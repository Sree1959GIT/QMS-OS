[project]
name = "qms-os"
version = "0.1.0"
description = "QMS OS — internal audit, nonconformity/corrective action and risk management system of record"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # authentication (R-3)
    "argon2-cffi>=25.1",
    "pyotp>=2.9",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# PostgreSQL driver and migrations; not installed in CI (SQLite only there)
postgres = ["psycopg[binary]>=3.2", "alembic>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qms_os*"]

[tool.setuptools.package-data]
"qms_os.auth" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a PostgreSQL test database (QMS_TEST_POSTGRES_URL); skipped otherwise",
]
