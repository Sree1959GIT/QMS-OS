name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # manual run, e.g. a full-history secret scan on any branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-ci.txt

      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  test-py311:
    # The SQLite suite on the oldest Python that pyproject.toml allows (requires-python >= 3.11; SQLAlchemy 2.1 needs
    # 3.11 too). Patch version pinned like the other jobs; the "Python version" step prints what was installed.
    name: test-py311
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints-ci.txt

      - name: Python version
        run: python -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 11, 17), sys.version_info"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-ci.txt

      - name: Test
        run: python -m pytest -q -p no:cacheprovider

  lint:
    # ruff check with the rule list in pyproject.toml ([tool.ruff]); ruff is the only package installed.
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: Install ruff
        run: python -m pip install ruff -c constraints-ci.txt

      - name: Lint
        run: python -m ruff check --no-cache --output-format=github .

      - name: Image digest check
        # R-21 (ROADMAP slice 3a): every container image reference in a tracked Dockerfile, compose file or workflow
        # is pinned by @sha256 digest or listed in scripts/image-digest-baseline.txt; a stale baseline entry fails.
        # Standard library only; a step here rather than a seventh job (six required checks, R-13).
        working-directory: ${{ github.workspace }}
        run: python scripts/check_image_digests.py

  types:
    # mypy on qms_os with the configuration and the per-module baseline in pyproject.toml ([tool.mypy]). Installs the
    # postgres extra because qms_os/db.py imports alembic.
    name: types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint,postgres]" -c constraints-ci.txt

      - name: Type check
        run: python -m mypy --cache-dir "$RUNNER_TEMP/mypy-cache"

  postgres:
    # The PostgreSQL suite: the equivalent of scripts\run-pg-tests.bat full (whole suite on PostgreSQL, including the
    # migration-drift and concurrency tests). Throw-away service container; no password, no secrets.
    name: postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 17.11 (Debian 17.11-1.pgdg13+2): the exact image used for every local PostgreSQL run so far.
        # The digest decides what is pulled; the tag is for readers.
        image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: qmsos_test
          POSTGRES_USER: qmsos
          POSTGRES_HOST_AUTH_METHOD: trust # throw-away CI database on the runner; avoids any password in the workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qmsos -d qmsos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      # tests/pg_support.py accepts only a local host and a database name ending in _test
      QMS_TEST_POSTGRES_URL: postgresql://qmsos@127.0.0.1:5432/qmsos_test
      QMS_TEST_FULL_SUITE_ON_POSTGRES: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]" -c constraints-ci.txt

      - name: Test on PostgreSQL
        run: python -m pytest -q -p no:cacheprovider --tb=short

  secret-scan:
    # gitleaks with its default rules plus the minimal allowlist in .gitleaks.toml. Pull requests: only the pull
    # request's commits. Push to main and manual runs: the whole history.
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (whole history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (version and SHA-256 pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's gitleaks_8.30.1_checksums.txt (tag v8.30.1
          # = commit 83d9cd684c87d95d656c1458ef04895a7f1cbd8e); the download is refused if it differs
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --log-opts="${BASE_SHA}..${HEAD_SHA}"

      - name: Scan the whole history
        if: github.event_name != 'pull_request'
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner
